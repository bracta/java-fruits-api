my.fruit=banana
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.swagger-ui.always-include=true
# mp.openapi.extensions.smallrye.operationIdStrategy=PACKAGE_CLASS_METHOD
# make sure the swagger API is served from root
quarkus.smallrye-openapi.path=/swagger.json
# API Info
quarkus.smallrye-openapi.info-title=Fruits API
%dev.quarkus.smallrye-openapi.info-title=Fruits API (development)
%test.quarkus.smallrye-openapi.info-title=Fruits API (test)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=An API that provides information about Fruits
quarkus.smallrye-openapi.info-contact-email=kamesh.sampath@hotmail.com
quarkus.smallrye-openapi.info-contact-name=Fruits API Support
quarkus.smallrye-openapi.info-contact-url=http://exampleurl.com/contact
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
# CI profile — H2 in-memory datasource for pipeline builds
%ci.quarkus.datasource.db-kind=h2
%ci.quarkus.datasource.jdbc.url=jdbc:h2:mem:fruitsdb;DB_CLOSE_DELAY=-1
%ci.quarkus.datasource.username=sa
%ci.quarkus.datasource.password=
%ci.quarkus.hibernate-orm.database.generation=drop-and-create
# Load seed data at runtime — Quarkus only auto-loads import.sql in dev/test, not in a packaged app
%ci.quarkus.hibernate-orm.sql-load-script=import.sql

# Regression profile — same H2 datasource as ci, but app reports NOT ready (canary auto-rollback demo)
%regression.quarkus.datasource.db-kind=h2
%regression.quarkus.datasource.jdbc.url=jdbc:h2:mem:fruitsdb;DB_CLOSE_DELAY=-1
%regression.quarkus.datasource.username=sa
%regression.quarkus.datasource.password=
%regression.quarkus.hibernate-orm.database.generation=drop-and-create
%regression.quarkus.hibernate-orm.sql-load-script=import.sql
%regression.app.ready=false

# Error-rate profile — pod stays READY but GET /api/fruits/ returns 500 (canary serves 5xx -> CV detects)
%errorrate.quarkus.datasource.db-kind=h2
%errorrate.quarkus.datasource.jdbc.url=jdbc:h2:mem:fruitsdb;DB_CLOSE_DELAY=-1
%errorrate.quarkus.datasource.username=sa
%errorrate.quarkus.datasource.password=
%errorrate.quarkus.hibernate-orm.database.generation=drop-and-create
%errorrate.quarkus.hibernate-orm.sql-load-script=import.sql
%errorrate.app.fail-list=true

# Test profile — H2 in-memory datasource (Quarkus auto-activates %test during mvn test)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:fruitsdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
