apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-fruits-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: java-fruits-api
  template:
    metadata:
      labels:
        app: java-fruits-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
      - image: {{.Values.image}}
        name: java-fruits-api
        ports:
        - containerPort: 8080
